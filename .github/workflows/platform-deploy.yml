name: Deploy Platform

on:
  workflow_dispatch:

jobs:
  deploy-platform:
    name: Deploy Platform Stack
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS credentials via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::758890598841:role/GitHubActions-CDK-Deploy-Role
          aws-region: ap-southeast-1

      # 3️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd platform
          npm ci

      # 5️⃣ Install AWS CDK
      - name: Install CDK
        run: npm install -g aws-cdk

      # 6️⃣ CDK Synth
      - name: CDK Synth
        run: |
          cd platform
          cdk synth

      # 7️⃣ CDK Deploy Platform Stack
      - name: CDK Deploy
        run: |
          cd platform
          cdk deploy kvs-dev-platform-sg --require-approval never