name: Destroy Foundation Stack

# Trigger manually from GitHub Actions UI
on:
  workflow_dispatch:

jobs:
  destroy-foundation:
    name: Destroy Foundation Stack
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS credentials via OIDC role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::758890598841:role/GitHubActions-CDK-Deploy-Role
          aws-region: ap-southeast-1

      # 3️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd foundation
          npm ci

      # 5️⃣ Install AWS CDK
      - name: Install CDK
        run: npm install -g aws-cdk

      # 6️⃣ Destroy the stack
      - name: CDK Destroy
        run: |
          cd foundation
          cdk destroy NetworkStack --force
